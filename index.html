<!DOCTYPE html>
<html>
<head>
<title>Level Search</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#4facfe,#00f2fe);
    font-family:Arial,sans-serif;
}

.welcome-box{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
    width:450px;
}

select,input{
    width:80%;
    padding:12px;
    margin:10px;
    border-radius:10px;
    border:2px solid #ddd;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#4facfe;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2e8df7;
}
</style>
</head>

<body>

<div class="welcome-box">

<h1>Welcome!</h1>

<p>
Select difficulty and level
</p>

<select id="difficulty" onchange="updateLevels()">

<option>Select Difficulty</option>

<option>Easy Demon</option>
<option>Medium Demon</option>
<option>Hard Demon</option>
<option>Insane Demon</option>
<option>Extreme Demon</option>

</select>

<input
type="text"
id="searchBox"
placeholder="Search level..."
onkeyup="filterLevels()">

<select id="levels">

<option>Select Level</option>

</select>

<br><br>

<button onclick="go()">
Search
</button>

</div>

<script>

const levelData={

"Easy Demon":[
"Clubstep",
"Theory of Everything 2",
"Deadlocked",
"The Nightmare",
"THE LIGHTNING ROAD",
"Platinum Adventure",
"Xstep v2",
"iSpyWithMyLittleEye",
"Speed Racer",
"X"
],

"Medium Demon":[
"Maffstep",
"B",
"Mechanical Showdown"
],

"Hard Demon":[
"Placeholder",
"Placeholder"
],

"Insane Demon":[
"Placeholder"
],

"Extreme Demon":[
"Bro",
"Yeah"
]

};

function updateLevels() {

    let difficulty =
    document.getElementById("difficulty").value;

    let levelSelect =
    document.getElementById("levels");

    // wipe dropdown
    levelSelect.innerHTML = "";

    // placeholder
    let first =
    document.createElement("option");

    first.text = "-- Select Level --";
    first.value = "";
    first.disabled = true;
    first.selected = true;

    levelSelect.add(first);

    // don't add anything if placeholder selected
    if (!levelData[difficulty]) return;

    levelData[difficulty].forEach(level => {

        let option =
        document.createElement("option");

        option.textContent = level;
        option.value = level;

        levelSelect.appendChild(option);

    });

}

function filterLevels() {

    let search =
    document.getElementById("searchBox")
    .value.toLowerCase();

    let difficulty =
    document.getElementById("difficulty")
    .value;

    let levelSelect =
    document.getElementById("levels");

    levelSelect.innerHTML = "";

    let first =
    document.createElement("option");

    first.text = "-- Select Level --";
    first.value = "";
    first.disabled = true;
    first.selected = true;

    levelSelect.add(first);

    if (!levelData[difficulty]) return;

    levelData[difficulty]
    .filter(level =>
        level.toLowerCase().includes(search)
    )
    .forEach(level => {

        let option =
        document.createElement("option");

        option.textContent = level;
        option.value = level;

        levelSelect.appendChild(option);

    });

}

function go(){

const links = {

"Clubstep":"clubstep.html",
"Theory of Everything 2":"theoryofeverything2.html",
"Deadlocked":"deadlocked.html",
"The Nightmare":"thenightmare.html",
"THE LIGHTNING ROAD":"thelightningroad.html",
"Platinum Adventure":"platinumadventure.html",
"Xstep v2":"xstepv2.html",
"iSpyWithMyLittleEye":"ispywithmylittleeye.html",
"Speed Racer":"speedracer.html",
"X":"x.html"

};

let level =
document.getElementById("levels").value;

if(level && links[level]){

window.location.href =
"https://dddjeremy.github.io/Level.Skillsets/"
+ links[level];

}

}

</script>

</body>
</html>
