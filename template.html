<!DOCTYPE html>
<html>
<head>
  <title>Pie Chart</title>

  <!-- Google Charts Loader -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <script>
    // Load chart package
    google.charts.load('current', {'packages':['corechart']});

    // Draw chart when loaded
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {

      // DATA
      var data = google.visualization.arrayToDataTable([
        ['Category', 'Amount'],

        ['Cube', 0],
        ['Ship', 0],
        ['Ball', 0],
        ['UFO', 0],
        ['Wave', 0],
        ['Robot', 0],
        ['Spider', 0],
        ['Swing', 0],
        ['Nerve Control', 0],
        ['Memory', 0],
        ['Learny', 0],
        ['Duals', 0],
        ['Chokepoints', 0],
        ['High CPS', 0],
        ['Timings', 0],
        ['Flow', 0],
        ['Overall', 0],
        ['Gimmicky', 0],
        ['Fast-Paced', 0],
        ['Slow-Paced', 0]
      ]);

      // SETTINGS
      var options = {
        title: 'Skillset Profile: Level',

        width: 900,
        height: 700,

        // 0 = normal pie chart
        // 0.4 = donut chart
        pieHole: 0,
        
        // CUSTOM COLORS
        colors: [
          '#3366CC',
          '#DC3912',
          '#FF9900',
          '#109618',
          '#990099',
          '#0099C6',
          '#DD4477',
          '#66AA00',
          '#B82E2E',
          '#316395',
          '#994499',
          '#22AA99',
          '#AAAA11',
          '#6633CC',
          '#E67300',
          '#8B0707',
          '#651067',
          '#329262',
          '#5574A6',
          '#3B3EAC'
        ]
      };

      // CREATE CHART
      var chart = new google.visualization.PieChart(
        document.getElementById('piechart')
      );

      chart.draw(data, options);
    }
  </script>
</head>

<body>
  <!-- Chart appears here -->
  <div id="piechart"></div>
</body><body>

  <button id="exitBtn" onclick="goHome()">Exit</button>

  <!-- Chart appears here -->
  <div id="piechart"></div>

  <script>
    function goHome() {
      window.location.href =
      "https://dddjeremy.github.io/Level.Skillsets/";
    }
  </script>

  <style>
    #exitBtn {
      position: absolute;
      top: 20px;
      left: 20px;

      padding: 10px 18px;
      border: none;
      border-radius: 10px;

      background: #ff4d4d;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    #exitBtn:hover {
      background: #e63737;
    }
  </style>

</body>
</html>
